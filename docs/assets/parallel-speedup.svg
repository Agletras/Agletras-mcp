<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Parallel execution speedup</title>
  <desc id="desc">Measured speedups of 3.97x, 3.74x, and 2.87x over sequential execution.</desc>
  <style>
    text { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .title { font-size: 24px; font-weight: 700; fill: #1f2328; }
    .subtitle { font-size: 14px; fill: #57606a; }
    .label { font-size: 13px; fill: #1f2328; }
    .muted { font-size: 12px; fill: #57606a; }
    .small { font-size: 11px; fill: #57606a; }
    .value { font-size: 14px; font-weight: 700; fill: #1f2328; }
    .big { font-size: 32px; font-weight: 700; fill: #1f2328; }
    .count { font-size: 20px; font-weight: 700; fill: #1f2328; }
    .card { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
    .chip { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    .grid { stroke: #d0d7de; stroke-width: 1; }
    .baseline { stroke: #bf8700; stroke-width: 2; stroke-dasharray: 5 5; }
    .track { fill: none; stroke: #d8dee4; }
    .blue { fill: #2f81f7; }
    .green { fill: #2da44e; }
    .purple { fill: #8250df; }
    .amber { fill: #bf8700; }
    .red { fill: #cf222e; }
    .gray { fill: #8b949e; }
    .ring-blue { fill: none; stroke: #2f81f7; }
    .ring-green { fill: none; stroke: #2da44e; }
    @media (prefers-color-scheme: dark) {
      .title, .label, .value, .big, .count { fill: #e6edf3; }
      .subtitle, .muted, .small { fill: #8b949e; }
      .card { fill: #161b22; stroke: #30363d; }
      .chip { fill: #0d1117; stroke: #30363d; }
      .grid { stroke: #30363d; }
      .track { stroke: #30363d; }
    }
</style>
  <rect class="card" x="1" y="1" width="958" height="428" rx="16"/>
<text x="40" y="50" class="title" text-anchor="start">Parallel execution speedup</text>
<text x="40" y="78" class="subtitle" text-anchor="start">Same workload, sequential vs bounded parallel execution · 4 workers</text>
<line class="grid" x1="330" y1="120" x2="330" y2="340"/>
<text x="330" y="362" class="small" text-anchor="middle">0×</text>
<line class="grid" x1="438" y1="120" x2="438" y2="340"/>
<text x="438" y="362" class="small" text-anchor="middle">1×</text>
<line class="grid" x1="546" y1="120" x2="546" y2="340"/>
<text x="546" y="362" class="small" text-anchor="middle">2×</text>
<line class="grid" x1="654" y1="120" x2="654" y2="340"/>
<text x="654" y="362" class="small" text-anchor="middle">3×</text>
<line class="grid" x1="762" y1="120" x2="762" y2="340"/>
<text x="762" y="362" class="small" text-anchor="middle">4×</text>
<line class="grid" x1="870" y1="120" x2="870" y2="340"/>
<text x="870" y="362" class="small" text-anchor="middle">5×</text>
<line class="baseline" x1="438" y1="112" x2="438" y2="346"/>
<text x="446" y="114" class="small" text-anchor="start">1× = sequential</text>
<rect class="blue" x="330" y="148" width="428.76" height="38" rx="7"/>
<text x="314" y="165" class="label" text-anchor="end">8 sleep tasks</text>
<text x="314" y="182" class="small" text-anchor="end">0.802 s → 0.202 s</text>
<text x="768.76" y="172" class="value" text-anchor="start">3.97×</text>
<rect class="green" x="330" y="218" width="403.92" height="38" rx="7"/>
<text x="314" y="235" class="label" text-anchor="end">8 URLs, 0.12 s latency</text>
<text x="314" y="252" class="small" text-anchor="end">1.074 s → 0.287 s</text>
<text x="743.92" y="242" class="value" text-anchor="start">3.74×</text>
<rect class="purple" x="330" y="288" width="309.96" height="38" rx="7"/>
<text x="314" y="305" class="label" text-anchor="end">6 monitored targets</text>
<text x="314" y="322" class="small" text-anchor="end">0.797 s → 0.278 s</text>
<text x="649.96" y="312" class="value" text-anchor="start">2.87×</text>
<text x="330" y="362" class="small" text-anchor="middle">0×</text>
<text x="40" y="405" class="small" text-anchor="start">Measured on a throwaway local HTTP server · parallel mode is opt-in; sequential execution remains the default.</text>
</svg>
