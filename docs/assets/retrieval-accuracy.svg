<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">Project-memory retrieval accuracy</title>
  <desc id="desc">Precision at 5 and recall at 5 are both 1.00 across six labeled topics.</desc>
  <style>
    text { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .title { font-size: 24px; font-weight: 700; fill: #1f2328; }
    .subtitle { font-size: 14px; fill: #57606a; }
    .label { font-size: 13px; fill: #1f2328; }
    .muted { font-size: 12px; fill: #57606a; }
    .small { font-size: 11px; fill: #57606a; }
    .value { font-size: 14px; font-weight: 700; fill: #1f2328; }
    .big { font-size: 32px; font-weight: 700; fill: #1f2328; }
    .count { font-size: 20px; font-weight: 700; fill: #1f2328; }
    .card { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
    .chip { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    .grid { stroke: #d0d7de; stroke-width: 1; }
    .baseline { stroke: #bf8700; stroke-width: 2; stroke-dasharray: 5 5; }
    .track { fill: none; stroke: #d8dee4; }
    .blue { fill: #2f81f7; }
    .green { fill: #2da44e; }
    .purple { fill: #8250df; }
    .amber { fill: #bf8700; }
    .red { fill: #cf222e; }
    .gray { fill: #8b949e; }
    .ring-blue { fill: none; stroke: #2f81f7; }
    .ring-green { fill: none; stroke: #2da44e; }
    @media (prefers-color-scheme: dark) {
      .title, .label, .value, .big, .count { fill: #e6edf3; }
      .subtitle, .muted, .small { fill: #8b949e; }
      .card { fill: #161b22; stroke: #30363d; }
      .chip { fill: #0d1117; stroke: #30363d; }
      .grid { stroke: #30363d; }
      .track { stroke: #30363d; }
    }
</style>
  <rect class="card" x="1" y="1" width="958" height="468" rx="16"/>
<text x="40" y="50" class="title" text-anchor="start">Project-memory retrieval accuracy</text>
<text x="40" y="78" class="subtitle" text-anchor="start">Labeled corpus: 6 topics × 4 passages · 6 queries · top-5 retrieval</text>
<circle cx="300" cy="215" r="68" class="track" stroke-width="18"/>
<circle cx="300" cy="215" r="68" class="ring-blue" stroke-width="18" stroke-linecap="round" stroke-dasharray="427.26 0.00" transform="rotate(-90 300 215)"/>
<text x="300" y="219" class="big" text-anchor="middle">1.00</text>
<text x="300" y="245" class="muted" text-anchor="middle">100%</text>
<text x="300" y="335" class="label" text-anchor="middle">Precision@5</text>
<text x="300" y="355" class="small" text-anchor="middle">6 of 6 topics perfect</text>
<circle cx="660" cy="215" r="68" class="track" stroke-width="18"/>
<circle cx="660" cy="215" r="68" class="ring-green" stroke-width="18" stroke-linecap="round" stroke-dasharray="427.26 0.00" transform="rotate(-90 660 215)"/>
<text x="660" y="219" class="big" text-anchor="middle">1.00</text>
<text x="660" y="245" class="muted" text-anchor="middle">100%</text>
<text x="660" y="335" class="label" text-anchor="middle">Recall@5</text>
<text x="660" y="355" class="small" text-anchor="middle">6 of 6 topics perfect</text>
<rect class="chip" x="40" y="370" width="136" height="54" rx="10"/>
<text x="52" y="393" class="small" text-anchor="start">heliotrope</text>
<text x="52" y="414" class="value" text-anchor="start">P 1.00 · R 1.00</text>
<rect class="chip" x="184" y="370" width="136" height="54" rx="10"/>
<text x="196" y="393" class="small" text-anchor="start">obsidian</text>
<text x="196" y="414" class="value" text-anchor="start">P 1.00 · R 1.00</text>
<rect class="chip" x="328" y="370" width="136" height="54" rx="10"/>
<text x="340" y="393" class="small" text-anchor="start">quartzite</text>
<text x="340" y="414" class="value" text-anchor="start">P 1.00 · R 1.00</text>
<rect class="chip" x="472" y="370" width="136" height="54" rx="10"/>
<text x="484" y="393" class="small" text-anchor="start">marlin</text>
<text x="484" y="414" class="value" text-anchor="start">P 1.00 · R 1.00</text>
<rect class="chip" x="616" y="370" width="136" height="54" rx="10"/>
<text x="628" y="393" class="small" text-anchor="start">pelican</text>
<text x="628" y="414" class="value" text-anchor="start">P 1.00 · R 1.00</text>
<rect class="chip" x="760" y="370" width="136" height="54" rx="10"/>
<text x="772" y="393" class="small" text-anchor="start">tundra</text>
<text x="772" y="414" class="value" text-anchor="start">P 1.00 · R 1.00</text>
<text x="40" y="450" class="small" text-anchor="start">Measured by scripts/evaluate_phase8.py on a temporary store · synthetic labeled corpus · no external network.</text>
</svg>
